 <!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="UTF-8" />
	<title ></title>
	<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <section class = "banner d-flex justify-content-center align-items-center ">
    <div>
    <h1 class="font-weight-bold text-center text-white">Smart Contact Manager </h1>
    <p class="text-white text-center">
    Your Ultimate Tool for Effortless Contact Organization and Seamless Connectivity!
    </p>
    <div style="text-align: center;">
    <a href="#" class="btn bg-primary btn-lg text-white">Get Started </a>
  <!-- <button class="btn bg-primary btn-lg text-white">Get Started</button> -->
  <!-- Hidden buttons for Login and Signup -->
            <div id="optionsContainer" class="hidden mt-4">
                <a href="#"
                  th:href="@{/signin}"
                  id="loginBtn" 
                  class="btn btn-success btn-lg btn-custom">Signin</a>
                  
                 <a href="#"
                  th:href="@{/signup}"
                  id="signupBtn" 
                  class="btn btn-warning btn-lg btn-custom">Signup</a> 
                  
                <!-- <button id="loginBtn" class="btn btn-success btn-lg btn-custom">Login</button>
                <button id="signupBtn" class="btn btn-warning btn-lg btn-custom">Signup</button> -->
            </div>
  
    </div>

    </div>
    </section>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Get references to the buttons and container
        const getStartedBtn = document.getElementById('btn bg-primary btn-lg text-white');
        const optionsContainer = document.getElementById('optionsContainer');

        // Add click event listener for "Get Started" button
        getStartedBtn.addEventListener('click', function () {
            // Hide the "Get Started" button
            getStartedBtn.style.display = 'none';
            // Show the Login and Signup buttons
            optionsContainer.classList.remove('hidden');
        });

        // Add event listeners for Login and Signup buttons
        document.getElementById('loginBtn').addEventListener('click', function () {
            alert('Redirecting to Login...');
        });

        document.getElementById('signupBtn').addEventListener('click', function () {
            alert('Redirecting to Signup...');
        });
    </script>
	
</body>
</html>
