<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{normal/base::layout(~{::section})}">
<head>
  <meta charset="UTF-8" />
  <title th:text="title"></title>
</head>
<body>

<section>
  <div class="card mx-5 my-1">
    <div class="card-body">
      <h1 class="text-center">Update Your Contact</h1>
      <div class="container-fluid mt-3">
        <div class="row justify-content-center">
          <div class="col-md-8">
          
        <!--  message box -->
          <div class="container">
    <div th:if="${session.message}" 
         th:classappend="'alert-' + ${session.message.type}" 
         class="alert text-center" 
         role="alert">
        <span th:text="${session.message.content}"></span>
    </div>
   <th:block th:remove="all">
    <span th:text="${@message.removeMessageFromSession('message')}"></span> 
</th:block>

</div>

          
            <form th:action="@{/user/process-update}" 
            th:object="${contact}" 
            method="POST" 
            enctype="multipart/form-data"
            class ="mt-2"
            >
            
             <!--  contact id -->
             
             <input th:value="${contact.cId}" type="hidden" name ="cId"/>

              
              <!-- First-Name -->
              <div class="form-group">
                <label for="firstname" class="font-weight-bold">First Name</label>
                <input th:value="${contact.name}"  type="text" id="firstname" name="name" placeholder="Enter Name Here" class="form-control" required />
              </div>

             <!--  Nick-Name (Fix name attribute) -->
              <div class="form-group">
                <label for="nickname" class="font-weight-bold">Nick Name</label>
                <input th:value="${contact.nickName}" type="text" id="nickname" name="nickName" placeholder="Enter Nick Name Here" class="form-control" required />
              </div>

             <!--  Email -->
              <div class="form-group">
                <label for="email" class="font-weight-bold">Email</label>
                <input th:value="${contact.email}"  type="email" id="email" name="email" placeholder="Enter Email Here" class="form-control" required />
              </div>

             <!--  Phone -->
              <div class="form-group">
                <label for="phone" class="font-weight-bold">Phone Number</label>
                <input th:value="${contact.phone}" type="tel" id="phone" name="phone" placeholder="Enter Phone Number" class="form-control" required max="10"/>
              </div>
              
              <!-- Work -->
              <div class="form-group">
                <label for="work" class="font-weight-bold">Work</label>
                <input th:value="${contact.work}" type="text" id="work" name="work" placeholder="Enter Work Here" class="form-control" required />
              </div>
              
             <!--  Contact Description -->
              <div class="form-group">
                <textarea th:text="${contact.description}"  id="mytextarea" placeholder="Enter Contact Description" name="description"  class="form-control" rows="5"></textarea>
              </div>
              
              <!-- <!-- Contact Image (File Input) -->
              <div class="container text-center">
              <img style="width:150px;height :150px;" class="my_profile_picture" src="" th:src="@{'/img/' + ${contact.image}}" alt="" />
              </div>
              
              <p class="text-bold">Choose New Profile Picture</p>
              
             <div class="form-group">
               <label for="image" class="font-weight-bold">Profile Image</label>
               <input th:value="${contact.image}" type="file" id="image" name="profileImage" class="form-control" />
             </div>

             <!--  Submit Button -->
              <div class="text-center mt-4">
                <button type="submit" class="btn bg-primary w-100 text-white">
                  <i class="fa fa-plus"></i> Update Contact
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Place the first <script> tag in your HTML's <head> -->
<script src="https://cdn.tiny.cloud/1/9bqsg5db5oqn0hyirud5049n07ag7690c6lacut57dnaw37o/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>

<!-- Place the following <script> and <textarea> tags your HTML's <body> -->
<script>
  tinymce.init({
    selector: '#mytextarea',
    plugins: [
      // Core editing features
      'anchor', 'autolink', 'charmap', 'codesample', 'emoticons', 'image', 'link', 'lists', 'media', 'searchreplace', 'table', 'visualblocks', 'wordcount',
      // Your account includes a free trial of TinyMCE premium features
      // Try the most popular premium features until Jan 7, 2025:
      'checklist', 'mediaembed', 'casechange', 'export', 'formatpainter', 'pageembed', 'a11ychecker', 'tinymcespellchecker', 'permanentpen', 'powerpaste', 'advtable', 'advcode', 'editimage', 'advtemplate', 'ai', 'mentions', 'tinycomments', 'tableofcontents', 'footnotes', 'mergetags', 'autocorrect', 'typography', 'inlinecss', 'markdown','importword', 'exportword', 'exportpdf'
    ],
    toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table mergetags | addcomment showcomments | spellcheckdialog a11ycheck typography | align lineheight | checklist numlist bullist indent outdent | emoticons charmap | removeformat',
    tinycomments_mode: 'embedded',
    tinycomments_author: 'Author name',
    mergetags_list: [
      { value: 'First.Name', title: 'First Name' },
      { value: 'Email', title: 'Email' },
    ],
    ai_request: (request, respondWith) => respondWith.string(() => Promise.reject('See docs to implement AI Assistant')),
  });
</script>

</section>

</body>
</html>
