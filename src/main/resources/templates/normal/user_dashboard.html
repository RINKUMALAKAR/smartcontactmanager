<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{normal/base::layout(~{::section})}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Smart Contact Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        header {
            background-color: #6200ea;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .dashboard-header {
            background-color: #6200ea;
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        .dashboard-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }
        .user-info {
            padding: 1.5rem;
        }
        .user-info h3 {
            margin: 0.5rem 0;
            font-size: 1rem;
            color: #333;
        }
        .actions {
            padding: 1rem;
            text-align: center;
            background: #f9f9f9;
        }
        .actions a {
            text-decoration: none;
            color: white;
            background-color: #6200ea;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        .actions a:hover {
            background-color: #3700b3;
        }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>
 <section>
 
        <div class="card mx-5 my-1">
             <div class="card-body">
                   <header>
    <h1>Welcome to Smart Contact Manager</h1>
</header>

<main>
    <div class="dashboard-header">
        <h2>Hello, <span th:text="${user.name}"></span>!</h2>
        <p>Email: <span th:text="${user.email}"></span></p>
        <p>Role: <span th:text="${user.role}"></span></p>
    </div>

    <div class="user-info">
        <h3>User ID: <span th:text="${user.id}"></span></h3>
    </div>

    <div class="actions">
        <a href="#" th:href="@{/logout}">Logout</a>
    </div>
</main>

<footer>
    <p>&copy; 2025 Smart Contact Manager. All rights reserved.</p>
</footer>
                   
                   
             
             
             </div>
        
        </div>
                    
           
 
 
 </section>


</body>
</html>
